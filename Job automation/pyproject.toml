[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobauto"
version = "0.2.0"
description = "Job discovery plus agent-written, fact-locked, independently reviewed applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "job-automation contributors" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "pypdf>=4,<7",
  "pypdfium2>=4.30,<6",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
# JobSpy pins NumPy 1.26, which has no wheel for Python 3.13+.
jobspy = ["python-jobspy==1.1.82"]
dev = ["pytest>=8"]

[project.scripts]
jobauto = "jobauto.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["jobauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
